name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: studentverse_test
          POSTGRES_USER: svuser
          POSTGRES_PASSWORD: svpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      DJANGO_DEBUG: "true"
      DATABASE_URL: postgresql://svuser:svpassword@localhost:5432/studentverse_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run system checks
        working-directory: src
        run: python manage.py check

      - name: Run migrations
        working-directory: src
        run: python manage.py migrate --noinput

      - name: Run test suite
        working-directory: src
        run: python manage.py test --verbosity=2

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install linting tools
        run: pip install flake8 flake8-bugbear

      - name: Run flake8
        run: flake8 src --max-line-length=120 --extend-ignore=E203,W503
